<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlateVision ALPR System - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>🚗</text></svg>">
</head>
<body class="auth-body">

<div class="auth-card">
    <div class="auth-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    </div>
    <h1>PlateVision</h1>
    <p class="subtitle">Automatic License Plate Recognition</p>
    
    <h2>Account Login</h2>
    
    <div class="form-group" style="text-align: left;">
        <label for="username">Username</label>
        <input type="text" id="username" class="form-input" placeholder="Operator username">
    </div>

    <div class="form-group" style="text-align: left;">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••">
    </div>

    <button onclick="login()" class="btn-primary" style="margin-top: 10px;">
        Sign In
    </button>

    <p id="message" style="margin-top: 15px; font-weight: 600; font-size: 13px;"></p>
    

</div>

<script src="api.js"></script>
<script src="app.js"></script>

</body>
</html>
